# TenderHack SPB — production stack
# Запуск: docker compose up -d --build
# Развёртка на чистом российском сервере без VPN: все 4 источника работают из коробки.
#
#   ┌──────────┐    ┌─────────────┐    ┌──────────────┐    ┌──────────────┐
#   │ frontend │ →  │   backend   │ →  │ parser-server│ →  │ stealth-proxy│
#   │  :80     │    │ (FastAPI)   │    │  (Node)      │    │ (Playwright  │
#   │  nginx   │    │  :8000      │    │  :8008       │    │  +stealth)   │
#   └──────────┘    └─────────────┘    └──────────────┘    │  :9377       │
#                                                          └──────────────┘

services:
  stealth-proxy:
    build:
      context: ./backend
      dockerfile: Dockerfile.node
    command: node stealth-proxy.js
    init: true
    shm_size: '2gb'              # Chromium нужен большой /dev/shm
    restart: unless-stopped
    expose:
      - "9377"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9377/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  parser-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.node
    command: node server.js
    init: true
    restart: unless-stopped
    expose:
      - "8008"
    environment:
      PARSER_PORT: 8008
      STEALTH_BROWSER_URL: http://stealth-proxy:9377
    depends_on:
      stealth-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    shm_size: '2gb'              # Playwright для Рунета
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PARSER_SERVER_URL: http://parser-server:8008
      USE_LLM: "0"
      PYTHONUNBUFFERED: "1"
    depends_on:
      parser-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
